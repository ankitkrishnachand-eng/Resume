<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <!-- Google Fonts for elegant typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. CORE STYLES & RESET
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1a1c29 0%, #3a1c40 50%, #1a1c29 100%);
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      color: #333;
      position: relative;
    }

    /* Fullscreen Confetti Canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
    }

    /* Ambient Background Glow */
    .bg-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255, 182, 193, 0.25) 0%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      border-radius: 50%;
    }

    /* Main Wrapper */
    .container {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* Instruction Text */
    .hint-text {
      color: rgba(255, 255, 255, 0.85);
      font-size: 1rem;
      letter-spacing: 1.5px;
      margin-top: 25px;
      text-transform: uppercase;
      animation: pulse 2s infinite;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      text-align: center;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }

    /* =========================================================
       2. ENVELOPE & LETTER CONTAINER (3D TRANSFORMS)
       ========================================================= */
    .envelope-wrapper {
      position: relative;
      width: 320px;
      height: 220px;
      background-color: #e36588;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      perspective: 1000px;
      transition: transform 0.3s ease;
    }

    .envelope-wrapper:hover {
      transform: translateY(-5px);
    }

    /* Envelope Top Flap */
    .envelope-wrapper .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid transparent;
      border-right: 160px solid transparent;
      border-top: 115px solid #d45275;
      transform-origin: top;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.4s, z-index 0.2s 0.4s;
      z-index: 4;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.15));
    }

    /* Envelope Side Flaps */
    .envelope-wrapper .pocket-left {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid #e05b80;
      border-top: 110px solid transparent;
      border-bottom: 110px solid #e05b80;
      border-bottom-left-radius: 12px;
      z-index: 3;
    }

    .envelope-wrapper .pocket-right {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 0;
      height: 0;
      border-right: 160px solid #e05b80;
      border-top: 110px solid transparent;
      border-bottom: 110px solid #e05b80;
      border-bottom-right-radius: 12px;
      z-index: 3;
    }

    .envelope-wrapper .pocket-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid transparent;
      border-right: 160px solid transparent;
      border-bottom: 115px solid #c9496d;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      z-index: 3;
    }

    /* Heart Wax Seal */
    .heart-seal {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      background: #bd1d43;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 20px;
      z-index: 5;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    /* Inside Letter / Card */
    .letter {
      position: absolute;
      bottom: 10px;
      left: 15px;
      width: 290px;
      height: 200px;
      background: #fffdfa;
      border-radius: 8px;
      padding: 25px 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      z-index: 2;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.6s, height 0.6s ease 1s;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .letter h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.2rem;
      color: #d45275;
      margin-bottom: 12px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s ease 1.2s, transform 0.5s ease 1.2s;
    }

    .letter p {
      font-size: 0.92rem;
      color: #555;
      line-height: 1.6;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s ease 1.4s, transform 0.5s ease 1.4s;
    }

    .letter .signature {
      margin-top: 15px;
      font-family: 'Dancing Script', cursive;
      font-size: 1.4rem;
      color: #d45275;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s ease 1.6s, transform 0.5s ease 1.6s;
    }

    /* =========================================================
       3. OPENED STATE ANIMATIONS
       ========================================================= */
    .envelope-wrapper.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.1s 0.3s;
    }

    .envelope-wrapper.open .heart-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.5);
    }

    .envelope-wrapper.open .letter {
      transform: translateY(-160px);
      height: 320px;
      z-index: 5;
      box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    }

    .envelope-wrapper.open .letter h1,
    .envelope-wrapper.open .letter p,
    .envelope-wrapper.open .letter .signature {
      opacity: 1;
      transform: translateY(0);
    }

    /* Hide hint once opened */
    .envelope-wrapper.open + .hint-text {
      opacity: 0;
      animation: none;
    }

    /* =========================================================
       4. AUDIO CONTROLLER BAR
       ========================================================= */
    .audio-control {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 16px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      font-size: 0.85rem;
      z-index: 20;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      transition: background 0.3s ease;
    }

    .audio-control:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .audio-icon {
      font-size: 1.1rem;
    }

    /* Responsive adjustments */
    @media (max-height: 600px) {
      .container {
        transform: scale(0.85);
      }
    }
  </style>
</head>
<body>

  <!-- Confetti Background Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Ambient Glow -->
  <div class="bg-glow"></div>

  <!-- Main Card Container -->
  <div class="container">
    <div class="envelope-wrapper" id="envelope">
      <div class="flap"></div>
      <div class="pocket-left"></div>
      <div class="pocket-right"></div>
      <div class="pocket-bottom"></div>
      <div class="heart-seal">♥</div>
      
      <div class="letter">
        <h1>Happy Birthday! 🎉</h1>
        <p>
          Wishing you a day filled with love, laughter, and all the joy in the world. May this year bring you endless happiness, beautiful moments, and great success!
        </p>
        <div class="signature">With love & best wishes ✨</div>
      </div>
    </div>
    
    <div class="hint-text">Click the envelope to open</div>
  </div>

  <!-- Audio Toggle Control -->
  <div class="audio-control" id="audioToggle">
    <span class="audio-icon" id="audioIcon">🎵</span>
    <span id="audioStatus">Music Off</span>
  </div>

  <!-- Audio Source (Royalty-free celebratory acoustic music track) -->
  <audio id="bgSong" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=happy-birthday-155461.mp3" type="audio/mpeg">
  </audio>

  <script>
    /* =========================================================
       1. ENVELOPE INTERACTIVITY & MUSIC AUTO-START
       ========================================================= */
    const envelope = document.getElementById('envelope');
    const bgSong = document.getElementById('bgSong');
    const audioToggle = document.getElementById('audioToggle');
    const audioIcon = document.getElementById('audioIcon');
    const audioStatus = document.getElementById('audioStatus');

    let isOpened = false;

    envelope.addEventListener('click', () => {
      if (!isOpened) {
        envelope.classList.add('open');
        isOpened = true;
        
        // Trigger celebratory continuous confetti bursts
        launchConfetti();
        
        // Play music upon interaction (bypasses browser autoplay block)
        playMusic();
      }
    });

    // Toggle Audio Control Button
    audioToggle.addEventListener('click', (e) => {
      e.stopPropagation(); // prevent triggering envelope click
      if (bgSong.paused) {
        playMusic();
      } else {
        pauseMusic();
      }
    });

    function playMusic() {
      bgSong.play().then(() => {
        audioIcon.textContent = '🔊';
        audioStatus.textContent = 'Music On';
      }).catch(err => console.log('Audio playback prevented:', err));
    }

    function pauseMusic() {
      bgSong.pause();
      audioIcon.textContent = '🔇';
      audioStatus.textContent = 'Music Off';
    }

    /* =========================================================
       2. REAL-TIME CANVAS CONFETTI SYSTEM
       ========================================================= */
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4caf50', '#8bc34a', '#cddc39', '#ffeb3b', '#ffc107', '#ff9800'];
    const confettiParticles = [];

    class Confetti {
      constructor(x, y, isBurst = false) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 8 + 4;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        
        // Initial velocities
        if (isBurst) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 12 + 4;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed - 3;
        } else {
          this.vx = (Math.random() - 0.5) * 4;
          this.vy = Math.random() * 3 + 1;
        }

        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 10;
        this.friction = 0.98;
        this.gravity = 0.15;
        this.opacity = 1;
        this.decay = Math.random() * 0.008 + 0.004;
      }

      update() {
        this.vx *= this.friction;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.rotationSpeed;
        this.opacity -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = Math.max(this.opacity, 0);
        ctx.fillStyle = this.color;
        ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        ctx.restore();
      }
    }

    function launchConfetti() {
      // Create initial burst around the envelope
      const rect = envelope.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      for (let i = 0; i < 120; i++) {
        confettiParticles.push(new Confetti(centerX, centerY, true));
      }

      // Add ambient continuous falling confetti from top
      setInterval(() => {
        if (confettiParticles.length < 250) {
          confettiParticles.push(new Confetti(Math.random() * width, -10, false));
        }
      }, 150);
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, width, height);

      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const p = confettiParticles[i];
        p.update();
        p.draw();

        // Remove invisible or off-screen particles
        if (p.opacity <= 0 || p.y > height + 20) {
          confettiParticles.splice(i, 1);
        }
      }

      requestAnimationFrame(animateConfetti);
    }

    // Start Animation Loop
    animateConfetti();
  </script>
</body>
</html>
